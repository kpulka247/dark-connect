<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dark Connect</title>
    <link rel="stylesheet" href="styles/popup.css" />
  </head>

  <body>
    <header>
      <img src="icons/icon48.png" alt="" class="logo" />
      <div>
        <h1>Dark Connect</h1>
        <p class="tagline">Dark mode for Garmin Connect</p>
      </div>
    </header>

    <main>
      <section class="card">
        <div class="card-head">
          <span class="card-title">Theme</span>
          <div class="segmented" role="radiogroup" aria-label="Theme">
            <input type="radio" id="theme-auto" name="theme" value="auto" />
            <label for="theme-auto">Auto</label>
            <input type="radio" id="theme-dark" name="theme" value="dark" />
            <label for="theme-dark">Dark</label>
            <input type="radio" id="theme-light" name="theme" value="light" />
            <label for="theme-light">Light</label>
          </div>
        </div>
        <p class="hint" id="theme-hint"></p>
      </section>

      <section class="card">
        <span class="card-title">Something still white?</span>
        <p class="hint">
          Open the Garmin page where you see it, then scan. You can check the
          report on GitHub before you send it.
        </p>
        <button type="button" class="primary" id="report-page">
          Scan this page
        </button>
        <p class="status" id="report-status" role="status"></p>
        <a
          class="secondary-link"
          href="https://github.com/kpulka247/dark-connect/issues/new/choose"
          target="_blank"
          >Or describe the problem yourself</a
        >
      </section>
    </main>

    <footer>
      <div class="footer-links">
        <span id="version"></span>
        <a
          href="https://github.com/kpulka247/dark-connect/releases"
          target="_blank"
          >What's new</a
        >
      </div>
      <a class="coffee" id="coffee" target="_blank">Buy me a coffee</a>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
